<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${destination.name}">Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .detail-card {
            border: none;
            background-color: #fefefe;
            transition: box-shadow 0.3s ease;
        }

        .detail-card:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            color: #0984e3;
            font-weight: bold;
        }

        .card-subtitle {
            font-style: italic;
        }

        .card-text {
            color: #2c3e50;
            line-height: 1.6;
        }

        .custom-footer {
            background-color: #00b894;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Tour de Lombok</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/destination/tour">Destinations</a></li>
                <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="card shadow detail-card">
        <div class="card-body">
            <h2 class="card-title" th:text="${destination.name}">Destination Name</h2>
            <h5 class="card-subtitle mb-2 text-muted" th:text="${destination.location}">Location</h5>
            <p class="card-text mt-3" th:text="${destination.description}">Description</p>
            <a href="/destination/tour" class="btn btn-outline-secondary mt-3">← Back to List</a>
        </div>
    </div>
</div>

<footer class="custom-footer text-center py-3 text-white">
    &copy; 2025 Tour de Lombok. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        console.log("Detail page loaded for:", document.title);
    });
</script>
</body>
</html>
