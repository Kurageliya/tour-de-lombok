<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Error - Tour de Lombok</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
        background-color: #f8f9fa;
    }

    .error-container {
        margin-top: 100px;
    }

    .error-card {
        border: none;
        background-color: #ffffff;
        box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        padding: 40px;
        text-align: center;
    }

    .error-title {
        font-size: 2rem;
        color: #e74c3c;
        font-weight: bold;
    }

    .error-message {
        font-size: 1.2rem;
        color: #2c3e50;
        margin-top: 10px;
    }

    .btn-back {
        margin-top: 30px;
    }

    .custom-footer {
        background-color: #00b894;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Tour de Lombok</a>
  </div>
</nav>

<div class="container error-container">
  <div class="error-card">
    <div class="error-title">Oops! Something went wrong.</div>
    <div class="error-message" th:text="${error}">The page you're looking for doesn't exist or cannot be loaded.</div>
    <a href="/home" class="btn btn-outline-secondary btn-back">← Back to Home</a>
  </div>
</div>

<footer class="custom-footer text-center py-3 text-white mt-5">
  &copy; 2025 Tour de Lombok. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
      console.log("Error page loaded");
  });
</script>
</body>
</html>
